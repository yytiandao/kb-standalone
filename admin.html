<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管理 · 结构设计知识库</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 与主站共用同一套设计 token 与基础组件 -->
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="admin/admin.css">
</head>
<body class="af">

<header class="af-top">
  <div class="af-brand">内容管理<small id="afBackend"></small></div>
  <div id="afDirty"></div>
  <div class="af-acts">
    <button class="af-btn af-ghost" id="afValidate">校验</button>
    <button class="af-btn" id="afPublish">发布上线</button>
    <button class="af-btn af-ghost" id="afExport">导出改动</button>
    <button class="af-btn af-ghost" id="afExportAll">导出全部</button>
    <label class="af-btn af-ghost af-mi-btn">导入<input type="file" id="afImportFile" accept=".js,text/javascript" hidden></label>
    <button class="af-btn af-danger" id="afDiscard">放弃改动</button>
    <button class="af-btn af-ghost" id="afLogout">退出登录</button>
    <button class="af-btn af-ghost" id="afPubSet">发布设置</button>
    <a class="af-btn af-ghost af-mi-btn" href="index.html">← 返回主站</a>
  </div>
</header>

<div id="afBoot" style="padding:0 18px"></div>
<div id="afConflict" style="padding:0 18px; display:none"></div>

<main class="af-main">
  <nav class="af-col af-col-tree" id="afTree" aria-label="内容类型"></nav>
  <section class="af-col af-col-list">
    <div id="afListHead"></div>
    <div id="afQaDomains"></div>
    <div id="afNote"></div>
    <div id="afList"></div>
  </section>
  <section class="af-col af-col-form">
    <div id="afFormHead"></div>
    <div id="afForm"></div>
  </section>
</main>

<div id="afProblems"><button id="afCloseProb" aria-label="关闭">×</button><div id="afProbBody"></div></div>
